[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-telegram-bot"
version = "0.1.0"
description = "Nexa: ücretsiz veri kaynaklarıyla BIST ve kripto Telegram botu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==22.6",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "matplotlib>=3.8,<4",
    "yfinance>=0.2.54,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["nexa*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
nexa = "nexa.bot:main"
